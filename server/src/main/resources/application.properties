server.address=127.0.0.1
server.port=4180
spring.application.name=PKMon-stage1-demo
spring.jackson.serialization.indent-output=true
server.error.include-message=always

# ---- 数据源与迁移（胡豪维护，详见 docs/stage2/baselines/environment.txt）----
# 默认（无 profile）：内存库，不写磁盘、不含秘密，适合直接启动验证与接口测试。
# 需要重启后保留数据时启用 dev profile（文件库）；数据库口令从环境变量 PKMON_DB_PASSWORD 读取，默认空。
spring.datasource.url=jdbc:h2:mem:pkmon;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${PKMON_DB_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
