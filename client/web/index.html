<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PKMon 校园探索：自习驻留、答题捕获与精灵收藏">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PKMon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PKMon 校园探索</title>

  <style>
    /* 加载期间的占位画面。Flutter 启动完成后会自己盖住它。 */
    html, body { margin: 0; padding: 0; height: 100%; background: #F7F8FA; }
    #boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      color: #2C7A6B;
      transition: opacity .3s;
    }
    #boot h1 { font-size: 30px; margin: 0 0 10px; letter-spacing: -1px; }
    #boot p  { font-size: 13px; color: #6B7280; margin: 0; }
  </style>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot">
    <h1>PKMon</h1>
    <p>正在加载校园…</p>
  </div>

  <script>
    // Flutter 首次渲染后把占位画面淡出
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
